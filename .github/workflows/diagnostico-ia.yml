name: Diagnóstico da IA
on: workflow_dispatch
permissions:
  models: read
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar GitHub Models
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          B='{"model":"openai/gpt-4.1","max_tokens":20,"messages":[{"role":"user","content":"Diga ola"}]}'
          H=(-H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "== catalogo"; curl -sS -i https://models.github.ai/catalog/models "${H[@]}" | head -c 600; echo
          echo "== inference"; curl -sS -i -X POST https://models.github.ai/inference/chat/completions "${H[@]}" -d "$B" | head -c 800; echo
          echo "== org inference"; curl -sS -i -X POST https://models.github.ai/orgs/${{ github.repository_owner }}/inference/chat/completions "${H[@]}" -d "$B" | head -c 800; echo
          echo "== azure legado"; curl -sS -i -X POST https://models.inference.ai.azure.com/chat/completions "${H[@]}" -d '{"model":"gpt-4o-mini","max_tokens":20,"messages":[{"role":"user","content":"Diga ola"}]}' | head -c 800; echo
          echo "== gemini"; [ -n "$GEMINI_API_KEY" ] && curl -sS -X POST https://generativelanguage.googleapis.com/v1beta/openai/chat/completions -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" -d '{"model":"gemini-3.8-flash","max_tokens":50,"messages":[{"role":"user","content":"Diga ola"}]}' | head -c 800 || echo "sem GEMINI_API_KEY"
