name: Claude (acionamento pelo navegador)

# Duas formas de acionar o Claude direto pelo GitHub no navegador:
#  1. Escreva @claude em uma issue, comentário ou revisão de PR (ex.: "@claude troque a fonte NHK por outra").
#  2. Actions → "Claude (acionamento pelo navegador)" → Run workflow → digite a tarefa.
# Autenticação: segredo CLAUDE_CODE_OAUTH_TOKEN (usa sua assinatura Claude Pro/Max, gerado com `claude setup-token`)
# ou ANTHROPIC_API_KEY (cobrança por uso na API).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que o Claude deve fazer no repositório"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true   # temporário, para diagnóstico
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.tarefa || '' }}
          claude_args: |
            --append-system-prompt "Responda em português do Brasil. Siga o CLAUDE.md e as skills em .claude/skills."
