# Configuração geral do Boletim
titulo: "Brasil e Mundo Hoje"
fuso_horario: "America/Sao_Paulo"
janela_horas: 26            # notícias publicadas nas últimas N horas
max_itens_por_fonte: 25
max_itens_por_secao: 18     # itens enviados ao modelo por seção

# Provedor de IA para resumo e roteiro:
#   auto      -> usa o primeiro com credencial: anthropic, depois gemini, depois github
#   gemini    -> Google Gemini, camada gratuita (segredo GEMINI_API_KEY, criado no Google AI Studio)
#   github    -> GitHub Models (em 03/11/2026 o serviço respondia apenas "OK", sem conteúdo)
#   anthropic -> Claude, pago (segredo ANTHROPIC_API_KEY)
provedor_ia: "auto"
modelos_ia:
  github: "openai/gpt-4.1"
  gemini: ["gemini-3.8-flash", "gemini-3.7-flash", "gemini-flash-lite-latest"]   # tentados em sequência se houver 503
  anthropic: "claude-sonnet-5-5"
duracao_alvo_min: 38             # entre 30 e 45 minutos
palavras_por_minuto: 150         # valor inicial; o agente mede o ritmo real da voz e se recalibra (estado/estado.json)
revisao_ia: auto                 # 2ª passada de checagem de fatos; auto = só no Claude (pago), para poupar a cota gratuita
intervalo_ia_s: 8                # pausa mínima entre chamadas à IA (limites por minuto das camadas gratuitas)

voz_tts: "pt-BR-AntonioNeural"   # vozes edge-tts: pt-BR-AntonioNeural, pt-BR-FranciscaNeural, pt-BR-ThalitaMultilingualNeural
voz_tts_secundaria: "pt-BR-ThalitaMultilingualNeural"  # voz mais expressiva; as seções alternam entre as duas
voz_tts_reserva: "pt-BR-FranciscaNeural"   # usada se uma das vozes acima falhar
velocidade_voz: "+0%"            # ritmo natural (antes +5%, que soava apressado)
pausa_entre_blocos_s: 0.5        # respiro entre parágrafos/notícias na locução
legendas: false                  # desde 05/11/2026 o vídeo sai sem legenda e sem arquivo de closed caption (.srt)
gerar_audio: true
gerar_video: true
resolucao_video: "1280x720"
vinhetas_animadas: true         # abertura e transições animadas com Manim (gratuito)

# Seções do boletim, na ordem de leitura. Cada seção tem identidade visual própria no vídeo, numa família de tons
# profundos que conversa com a marca (azul-noite e âmbar; ver marca/GUIA.md).
secoes:
  - {id: destaques,  titulo: "Manchetes do dia",          cor: "#0B1F3A", cor2: "#1F4E8C"}
  - {id: politica,   titulo: "Política",                  cor: "#4A1D2B", cor2: "#A23B4F"}
  - {id: economia,   titulo: "Economia e Mercados",       cor: "#0E3B2E", cor2: "#1E7A5A"}
  - {id: seguros,    titulo: "Seguros e Corretoras",      cor: "#3A3010", cor2: "#8C7426"}
  - {id: tecnologia, titulo: "Tecnologia",                cor: "#14254A", cor2: "#2F5DA8"}
  - {id: ia,         titulo: "Inteligência Artificial",   cor: "#2A1B4A", cor2: "#6A4FB3"}
  - {id: saude,      titulo: "Saúde",                     cor: "#0B3B3F", cor2: "#1C8C8C"}
  - {id: cultura,    titulo: "Cultura",                   cor: "#4A2410", cor2: "#C2612B"}
  - {id: encerramento, titulo: "Resumo e agenda",         cor: "#0B1F3A", cor2: "#3A4A63"}

regioes:
  brasil: "Brasil"
  europa: "Europa"
  eua: "Estados Unidos"
  asia: "Ásia"
  global: "Mundo / Organismos internacionais"
